# SDK-profile patch for the child runtime in the cwd-inheritance proof.

- id: llm-deepseek
  name: '@deepseek-ai/dsh-llm-deepseek'
  disabled: true

- id: system-prompt
  name: '@deepseek-ai/dsh-system-prompt'
  config:
    persona: 'Echo where you run.'

- id: agent-instructions
  name: '@deepseek-ai/dsh-agent-instructions'
  disabled: true

- id: skill-filesystem
  name: '@deepseek-ai/dsh-skill-filesystem'
  config:
    includeDefaultRoots: false

- id: session-persistence-jsonl
  name: '@deepseek-ai/dsh-session-persistence-jsonl'
  config:
    root: !!js dshHomePath('sessions')
    compression: none

- insert:
    - id: child-mock-llm
      name: './child-mock-llm.ts'

# `auto` follows the host's own locale, so a replay's prompt would change with
# the machine that produced it. Pin English — which emits no directive — and
# every recorded system prompt stays machine-independent.
- id: response-language
  name: '@deepseek-ai/dsh-response-language'
  config:
    language: en
