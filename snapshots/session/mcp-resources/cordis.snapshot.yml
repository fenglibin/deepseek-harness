# Keyless replay counterpart: the deterministic MCP resource server stays real
# and only the model adapter is replaced by replay.
- id: llm-deepseek
  name: '@deepseek-ai/dsh-llm-deepseek'
  disabled: true

- insert:
    - id: llm-replay
      name: '@deepseek-ai/dsh-llm-replay'
      config:
        providers:
          - id: deepseek-official
            name: DeepSeek
            models:
              # The replay route must reproduce the capability surface the
              # recording froze in its request header (contextWindow,
              # maxTokens, reasoning efforts). Without them the header's
              # adapter defaults differ and replay fails on the first header.
              - id: deepseek-chat
                contextWindow: 1000000
                defaultMaxTokens: 256000
                reasoningEfforts: [off, low, high, max]
                defaultReasoningEffort: max

    - id: mcp-resource-catalog
      name: '@deepseek-ai/dsh-mcp-client'
      config:
        transport: stdio
        serverName: catalog
        command: !!js process.execPath
        args: ['./resources-server.mjs']
        failOnStartupError: true
        reconnect:
          enabled: false
