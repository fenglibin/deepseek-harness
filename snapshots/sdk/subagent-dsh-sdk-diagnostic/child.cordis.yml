# SDK-profile patch for the deterministic diagnostic child runtime.

- id: llm-deepseek
  name: '@deepseek-ai/dsh-llm-deepseek'
  disabled: true

- id: agent-instructions
  name: '@deepseek-ai/dsh-agent-instructions'
  disabled: true

- id: system-prompt
  name: '@deepseek-ai/dsh-system-prompt'
  config:
    persona: 'Return the scripted DSH SDK failure.'

- insert:
    - id: child-mock-llm
      name: '../../../packages/subagent/subagent-dsh-sdk/tests/fixtures/loader/child-mock-llm.ts'

# The base layer pins Chinese, whose directive would enter every recorded
# system prompt. Pin English — which emits no directive — so the goldens stay
# free of it and independent of the machine that recorded them.
- id: response-language
  name: '@deepseek-ai/dsh-response-language'
  config:
    language: en
