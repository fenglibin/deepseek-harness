# SDK-profile patch for the deterministic diagnostic child runtime.

- id: llm-deepseek
  name: '@deepseek-ai/dsh-llm-deepseek'
  disabled: true

- id: agent-instructions
  name: '@deepseek-ai/dsh-agent-instructions'
  disabled: true

- id: system-prompt
  name: '@deepseek-ai/dsh-system-prompt'
  config:
    persona: 'Return the scripted DSH SDK failure.'

- insert:
    - id: child-mock-llm
      name: '../../../packages/subagent/subagent-dsh-sdk/tests/fixtures/loader/child-mock-llm.ts'

# `auto` follows the host's own locale, so a replay's prompt would change with
# the machine that produced it. Pin English — which emits no directive — and
# every recorded system prompt stays machine-independent.
- id: response-language
  name: '@deepseek-ai/dsh-response-language'
  config:
    language: en
