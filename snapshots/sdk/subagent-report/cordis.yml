# Snapshot-only overlay fencing the child behind its parent's spawn turn and
# holding the parent in maintenance until settlement follows the default
# next-step report. The resumed parent claims both notices in causal order.
- insert:
    - id: report-fence
      name: '../../../packages/test-support/session-snapshot/tests/fixtures/subagent-report-fence.ts'

# The base layer pins Chinese, whose directive would enter every recorded
# system prompt. Pin English — which emits no directive — so the goldens stay
# free of it and independent of the machine that recorded them.
- id: response-language
  name: '@deepseek-ai/dsh-response-language'
  config:
    language: en
