# Session-title snapshot composition: the optional first-prompt provider uses
# the ordinary DeepSeek route while the every other capability stay
# identical to the base example.
- insert:
    - id: session-title-provider
      name: '@deepseek-ai/dsh-session-title-first-prompt-llm'
      config:
        targetWords: 5
        targetCjkCharacters: 10
        maxInputBytes: 4096
        maxOutputTokens: 32
        timeoutMs: 5000
        provider: deepseek-official
        model: deepseek-v4-flash

# The base layer pins Chinese, whose directive would enter every recorded
# system prompt. Pin English — which emits no directive — so the goldens stay
# free of it and independent of the machine that recorded them.
- id: response-language
  name: '@deepseek-ai/dsh-response-language'
  config:
    language: en
