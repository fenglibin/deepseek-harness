# Session-title snapshot composition: the optional first-prompt provider uses
# the ordinary DeepSeek route while the every other capability stay
# identical to the base example.
- insert:
    - id: session-title-provider
      name: '@deepseek-ai/dsh-session-title-first-prompt-llm'
      config:
        targetWords: 5
        targetCjkCharacters: 10
        maxInputBytes: 4096
        maxOutputTokens: 32
        timeoutMs: 5000
        provider: deepseek-official
        model: deepseek-v4-flash

# `auto` follows the host's own locale, so a replay's prompt would change with
# the machine that produced it. Pin English — which emits no directive — and
# every recorded system prompt stays machine-independent.
- id: response-language
  name: '@deepseek-ai/dsh-response-language'
  config:
    language: en
